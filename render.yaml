# Render Blueprint (https://render.com/docs/blueprint-spec)
# Render dashboard → New → Blueprint → pick this repository. You will be asked for USI_SITE_PASSWORD.
services:
  - type: web
    name: upset-sale-intel
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: USI_APP_ENV
        value: production
      - key: USI_AUTH_MODE
        value: local
      - key: USI_SEED_DEMO
        value: "true"
      # Accept the automated sources' terms at start-up (Delco assessment/tax portal, Montco Tax Claim Bureau)
      # so a project the boss creates enriches without a manual acknowledgement step. Recorded in the audit log.
      - key: USI_AUTO_ACCEPT_TERMS
        value: "true"
      - key: USI_RUN_WORKER_IN_API
        value: "true"
      - key: USI_DATA_DIR
        value: /app/data
      - key: USI_SITE_USERNAME
        value: demo
      # Entered by you in the Render dashboard; never committed.
      - key: USI_SITE_PASSWORD
        sync: false
      # Your ATTOM API key — enter it in the Render dashboard (Environment). Enables ATTOM property enrichment + AVM.
      - key: USI_SECRET_PROVIDER_ATTOM_API_KEY
        sync: false
      # Optional but recommended: a free Neon Postgres URL (postgresql+psycopg://…?sslmode=require) so data survives
      # restarts. Leave blank to use the container's local file (which resets when the free instance spins down).
      - key: USI_DATABASE_URL
        sync: false
      # Random value generated by Render and kept stable across deploys; encrypts stored API keys.
      - key: USI_MASTER_KEY
        generateValue: true
      - key: USI_HTTP_USER_AGENT
        value: "UpsetSaleIntel/1.0 (property research)"

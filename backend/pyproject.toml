[project]
name = "upset-sale-intel"
version = "1.0.0"
description = "Property intelligence and upset-sale research application (Montgomery County PA, Delaware County PA)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
]
markers = [
    "source_pdf: tests that run against the full original county PDFs when available locally",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM102", "SIM108", "UP042"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
